<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ислам & Сабина — Свадебное приглашение</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio id="bg-music" src="music.mp3" loop></audio>

  <div class="overlay">
    <h1 class="title">Ислам & Сабина</h1>
    <p class="subtitle">Два сердца, одна судьба 💍</p>
  </div>

  <section class="countdown-section">
    <h2>До нашей свадьбы осталось:</h2>
    <div id="countdown">
      <div><span id="days">00</span><small>дней</small></div>
      <div><span id="hours">00</span><small>часов</small></div>
      <div><span id="minutes">00</span><small>минут</small></div>
      <div><span id="seconds">00</span><small>секунд</small></div>
    </div>
  </section>

  <section class="calendar">
    <h3>💌 1 января 2026</h3>
    <img src="https://i.ibb.co/ydyC6j5/calendar.png" alt="Календарь" class="calendar-img">
  </section>

  <section class="location">
    <h2>📍 Зал торжеств «Аль Фирай», Махачкала</h2>
    <iframe 
      src="https://www.google.com/maps?q=зал+торжеств+Аль+Фирай+Махачкала&output=embed" 
      width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy">
    </iframe>
  </section>

  <script src="script.js"></script>
  <script>
    document.body.addEventListener("click", () => {
      const audio = document.getElementById("bg-music");
      if (audio.paused) audio.play();
    });
  </script>
</body>
</html>
